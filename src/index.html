<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>QuattroMap</title>
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
</head>

<body>
	<!-- Vollbildmenü -->
	<div id="myNav" class="settings-panel" aria-hidden="true">
		<div class="settings-header">
			<div>
				<div class="settings-title">Einstellungen</div>
				<div class="settings-subtitle">Kartendarstellung anpassen</div>
			</div>

			<button type="button" class="settings-close" aria-label="Einstellungen schließen" title="Schließen"
				onclick="swapBars(document.getElementById('menu-button')); toggleNav();">
				✕
			</button>
		</div>

		<div class="settings-general">
			<div class="setting-group">
				<label for="map-count-select" class="setting-label">
					Anzahl Karten
				</label>

				<select id="map-count-select" class="setting-select">
					<option value="1">1 Karte</option>
					<option value="2">2 Karten</option>
					<option value="3">3 Karten</option>
					<option value="4">4 Karten</option>
				</select>
			</div>

			<div class="setting-group">
				<span class="setting-label">Fadenkreuz</span>

				<div class="crosshair-options" role="group" aria-label="Fadenkreuzfarbe">
					<button type="button" class="crosshair-option" data-colour="black" title="Schwarz">
						<img src="./img/cross_black.png" alt="Schwarz" />
					</button>

					<button type="button" class="crosshair-option" data-colour="red" title="Rot">
						<img src="./img/cross_red.png" alt="Rot" />
					</button>

					<button type="button" class="crosshair-option" data-colour="orange" title="Orange">
						<img src="./img/cross_orange.png" alt="Orange" />
					</button>

					<button type="button" class="crosshair-option" data-colour="yellow" title="Gelb">
						<img src="./img/cross_yellow.png" alt="Gelb" />
					</button>

					<button type="button" class="crosshair-option" data-colour="green" title="Grün">
						<img src="./img/cross_green.png" alt="Grün" />
					</button>

					<button type="button" class="crosshair-option" data-colour="blue" title="Blau">
						<img src="./img/cross_blue.png" alt="Blau" />
					</button>

					<button type="button" class="crosshair-option" data-colour="pink" title="Pink">
						<img src="./img/cross_pink.png" alt="Pink" />
					</button>
				</div>
			</div>
		</div>

		<div class="map-settings-grid">
			<section id="menu_map_1" class="map-settings-card">
				<div class="map-settings-header">
					<span class="map-settings-number">1</span>
					<span>Kartenfenster 1</span>
				</div>

				<div class="setting-group">
					<label for="form_1" class="setting-label">Karte</label>
					<select id="form_1" class="setting-select" onchange="setLayer1()"></select>
				</div>

				<div class="setting-group">
					<label for="form_overlay_1" class="setting-label">Overlay</label>
					<select id="form_overlay_1" class="setting-select" onchange="setOverlay1()">
						<option value="">Keins</option>
					</select>
				</div>

				<div class="setting-group">
					<div class="slider-heading">
						<label for="slider_1" class="setting-label">Deckkraft</label>
						<span id="slider_value_1" class="slider-value"></span>
					</div>

					<input id="slider_1" class="opacity-slider" type="range" min="0" max="100" step="1" />
				</div>
			</section>

			<section id="menu_map_2" class="map-settings-card">
				<div class="map-settings-header">
					<span class="map-settings-number">2</span>
					<span>Kartenfenster 2</span>
				</div>

				<div class="setting-group">
					<label for="form_2" class="setting-label">Karte</label>
					<select id="form_2" class="setting-select" onchange="setLayer2()"></select>
				</div>

				<div class="setting-group">
					<label for="form_overlay_2" class="setting-label">Overlay</label>
					<select id="form_overlay_2" class="setting-select" onchange="setOverlay2()">
						<option value="">Keins</option>
					</select>
				</div>

				<div class="setting-group">
					<div class="slider-heading">
						<label for="slider_2" class="setting-label">Deckkraft</label>
						<span id="slider_value_2" class="slider-value"></span>
					</div>

					<input id="slider_2" class="opacity-slider" type="range" min="0" max="100" step="1" />
				</div>
			</section>

			<section id="menu_map_3" class="map-settings-card">
				<div class="map-settings-header">
					<span class="map-settings-number">3</span>
					<span>Kartenfenster 3</span>
				</div>

				<div class="setting-group">
					<label for="form_3" class="setting-label">Karte</label>
					<select id="form_3" class="setting-select" onchange="setLayer3()"></select>
				</div>

				<div class="setting-group">
					<label for="form_overlay_3" class="setting-label">Overlay</label>
					<select id="form_overlay_3" class="setting-select" onchange="setOverlay3()">
						<option value="">Keins</option>
					</select>
				</div>

				<div class="setting-group">
					<div class="slider-heading">
						<label for="slider_3" class="setting-label">Deckkraft</label>
						<span id="slider_value_3" class="slider-value"></span>
					</div>

					<input id="slider_3" class="opacity-slider" type="range" min="0" max="100" step="1" />
				</div>
			</section>

			<section id="menu_map_4" class="map-settings-card">
				<div class="map-settings-header">
					<span class="map-settings-number">4</span>
					<span>Kartenfenster 4</span>
				</div>

				<div class="setting-group">
					<label for="form_4" class="setting-label">Karte</label>
					<select id="form_4" class="setting-select" onchange="setLayer4()"></select>
				</div>

				<div class="setting-group">
					<label for="form_overlay_4" class="setting-label">Overlay</label>
					<select id="form_overlay_4" class="setting-select" onchange="setOverlay4()">
						<option value="">Keins</option>
					</select>
				</div>

				<div class="setting-group">
					<div class="slider-heading">
						<label for="slider_4" class="setting-label">Deckkraft</label>
						<span id="slider_value_4" class="slider-value"></span>
					</div>

					<input id="slider_4" class="opacity-slider" type="range" min="0" max="100" step="1" />
				</div>
			</section>
		</div>
	</div>
	<!-- application panel -->
	<div class="app-panel">
		<div class="panel-header">
			<img class="panel-icon" src="./img/icon_quattromap.png" alt="" />

			<div class="panel-title">
				<div class="title-main">QuattroMap</div>
				<div class="title-sub">by Kreis Viersen</div>
			</div>
		</div>

		<div class="panel-actions">
			<button type="button" class="panel-button share-button" id="share-button"
				title="Permalink in die Zwischenablage kopieren" aria-label="Permalink kopieren"
				onclick="copyPermalink()">
				<img src="./img/share.svg" alt="" />
			</button>

			<button type="button" class="panel-button menu-button" id="menu-button" title="Einstellungen"
				aria-label="Einstellungen öffnen" onclick="swapBars(this); toggleNav();">
				<span class="menu-icon">
					<span class="bar1"></span>
					<span class="bar2"></span>
					<span class="bar3"></span>
				</span>
			</button>
		</div>
	</div>
	<div id="mouse-info"></div>
	<!-- Kartenfenster und Fadenkreuze -->
	<div id="map_1">
		<img src="./img/cross_black.png" id="cross_1" class="ch-image" alt="" />
	</div>

	<div id="map_2">
		<img src="./img/cross_black.png" id="cross_2" class="ch-image" alt="" />
	</div>

	<div id="map_3">
		<img src="./img/cross_black.png" id="cross_3" class="ch-image" alt="" />
	</div>

	<div id="map_4">
		<img src="./img/cross_black.png" id="cross_4" class="ch-image" alt="" />
	</div>

	<a target="_blank" rel="noopener noreferrer" href="https://gitlab.opencode.de/kreis-viersen/quattromap"
		class="opencode-corner" aria-label="Quellcode auf openCode" title="Quellcode auf openCode">
		<img src="img/openCode.svg" alt="openCode" class="opencode-corner-logo">

		<style>
			.opencode-corner {
				position: absolute;
				top: 10px;
				right: 10px;
				z-index: 10;

				display: flex;
				align-items: center;
				justify-content: center;

				width: 125px;
				height: 38px;
				padding: 4px 8px;

				background: rgba(255, 255, 255, 0.9);
				border: 1px solid rgba(0, 0, 0, 0.12);
				border-radius: 7px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

				box-sizing: border-box;
			}

			.opencode-corner-logo {
				display: block;
				width: 100%;
				height: auto;
				transform-origin: center;
			}

			.opencode-corner:hover .opencode-corner-logo {
				animation: opencode-wave 560ms ease-in-out;
			}

			@keyframes opencode-wave {

				0%,
				100% {
					transform: rotate(0deg);
				}

				20%,
				60% {
					transform: rotate(-4deg);
				}

				40%,
				80% {
					transform: rotate(3deg);
				}
			}

			@media (max-width: 600px),
			(max-height: 750px) {
				.opencode-corner {
					top: 8px;
					right: 8px;
					width: 95px;
					height: 32px;
					padding: 4px 6px;
				}

				.opencode-corner:hover .opencode-corner-logo {
					animation: none;
				}

				.opencode-corner .opencode-corner-logo {
					animation: opencode-wave 560ms ease-in-out;
				}
			}
		</style>
	</a>
	<script src="bundle.js"></script>
</body>

</html>
